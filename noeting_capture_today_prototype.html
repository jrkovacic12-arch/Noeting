<style>
:root{--paper:#f7f7f3;--surface:#fff;--ink:#18211e;--muted:#6b746e;--line:#e4e8e1;--accent:#27624c;--accent-light:#ebf3ed;--warm:#f5f0e7;--warn:#835936;--radius:17px;--shadow:0 16px 50px #19271c12}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.46}h1,h2,h3,p{margin-top:0}h1,h2{letter-spacing:-.045em}h1{font-size:clamp(31px,4vw,43px);line-height:1.12;margin-bottom:11px;font-weight:640}h2{font-size:22px;line-height:1.2;font-weight:610}h3{font-size:16px;letter-spacing:-.015em;font-weight:625;margin-bottom:5px}.muted{color:var(--muted)}.small{font-size:12.5px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#657168;font-weight:750}.app{max-width:1160px;padding:0 30px;margin:auto}.shell{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:100vh}.side{border-right:1px solid var(--line);padding:40px 17px 22px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{font-size:24px;font-weight:750;letter-spacing:-.08em;margin:0 0 38px 12px}.brand-dot{color:var(--accent)}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;text-align:left;display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:11px;color:#59635c;font-weight:575;width:100%}.nav button:hover,.nav button.active{background:#eaf0e9;color:#183f2d}.nav svg,.tool svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.side-bottom{margin-top:auto;padding:16px 10px 5px;font-size:12px;color:var(--muted)}.main{min-width:0;padding:43px 0 60px 48px}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:45px}.topline .meta{color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-weight:610;padding:9px 13px;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:background .12s,border-color .12s;white-space:nowrap}.btn:hover:not(:disabled){background:#f1f4ee}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.primary:hover:not(:disabled){background:#1e4c3a}.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}.btn.ghost:hover:not(:disabled){background:var(--accent-light)}.btn.subtle{background:#f8faf6}.btn.tiny{padding:6px 10px;font-size:12px}.btn.danger{color:#9b4f44}.hero{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:34px}.hero p{color:var(--muted);font-size:14px;max-width:660px;margin:0}.hero-tag{background:#e9efeb;border:1px solid #d8e4dc;color:#3f6b55;border-radius:999px;padding:5px 10px;font-size:11px;white-space:nowrap}.daily-summary{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 18px;margin-bottom:20px;color:var(--muted);font-size:13px}.daily-summary strong{color:var(--ink);font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(265px,1fr);gap:20px;align-items:start}.stack{display:grid;gap:20px;min-width:0}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:23px}.panel-head{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:17px}.panel-head h2{margin:0}.panel-head p{font-size:12px;color:var(--muted);margin:4px 0 0}.chip{background:#f2f5f0;border:1px solid #e5eae2;border-radius:999px;padding:2px 9px;font-size:11px;color:#566359;white-space:nowrap}.task-row,.entry-row,.review-row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid #eff0ec}.task-row:first-child,.entry-row:first-child,.review-row:first-child{border-top:0}.task-main,.entry-main{min-width:0;flex:1}.task-title,.entry-preview{font-size:14px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}.entry-preview{font-weight:520}.task-sub,.entry-meta{font-size:12px;color:var(--muted);margin-top:5px}.task-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.icon-btn{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 9px;font-size:12px;color:#455b4d;white-space:nowrap}.icon-btn:hover:not(:disabled){background:#eef4ee}.pin{color:#63766a}.pin.active{color:var(--accent);background:#edf5ee;border-color:#bbd3c4}.task-row.pinned{background:#f9fcf9;border-radius:10px;padding-left:10px;padding-right:10px}.demo-tools{margin:12px auto 30px;max-width:1160px;padding:0 30px}.demo-tools summary{font-size:12px;color:var(--muted);cursor:pointer}.demo-tools .demo-inner{margin-top:12px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}.checkbox-button{margin-top:1px;width:20px;height:20px;border:1.6px solid #bdc9bd;border-radius:7px;background:#fff;flex:none;color:#fff}.checkbox-button:hover{border-color:var(--accent)}.empty{border:1px dashed #d8e1d6;border-radius:13px;background:#fafcf9;padding:23px;text-align:left;color:#68766b;font-size:13px}.selected-thought{padding:18px;border:1px solid #e7e5de;background:#f9f8f3;border-radius:12px}.quote{font-family:Georgia,serif;font-size:18px;line-height:1.55;letter-spacing:-.01em;margin:10px 0 13px;overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.finish{background:#eef3ed;border:1px solid #d7e7d9;border-radius:var(--radius);padding:24px}.finish h2{font-size:19px;margin-bottom:7px}.finish p{font-size:13px;color:#58695d}.finish .btn{background:white}.done-screen{max-width:580px;margin:14vh auto;text-align:center}.done-screen .mark{margin:auto auto 22px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#e1ede2;color:var(--accent);font-size:28px}.done-screen h1{font-size:39px}.done-screen p{color:var(--muted)}.searchbar{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:12px 15px;outline:none}.searchbar:focus,input:focus,textarea:focus,select:focus{border-color:#8cb49c;outline:2px solid #8cb49c25}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 23px}.filter{border:1px solid var(--line);background:white;border-radius:999px;padding:5px 11px;font-size:12px;color:#606b64}.filter.active{background:var(--accent-light);color:var(--accent);border-color:#bcd4c3}.detail-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.heading-row{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.heading-row h2{margin:0}.note-copy{overflow-wrap:anywhere;white-space:pre-wrap}.divider{height:1px;background:var(--line);margin:20px 0}.notice{padding:12px 14px;background:var(--warm);color:#755337;border-radius:9px;font-size:12px;line-height:1.5}.field{display:grid;gap:7px;margin:0 0 17px}.field label{font-weight:640;font-size:12px;color:#39483d}.field input,.field select,.field textarea{border:1px solid #d7ded5;border-radius:10px;background:#fff;outline:none;padding:11px 12px;color:var(--ink);width:100%}.field textarea{resize:vertical;min-height:125px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8cb49c;outline:2px solid #8cb49c25}.field small{font-size:11px;color:var(--muted)}.form-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}.modal-backdrop{position:fixed;inset:0;background:#1a2721a0;display:flex;justify-content:center;align-items:center;padding:16px;z-index:20;overflow:auto}.modal{background:#fff;max-width:590px;width:100%;max-height:calc(100vh - 36px);overflow:auto;border-radius:18px;box-shadow:0 25px 90px #0003;padding:27px}.modal-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:23px}.modal-head h2{margin:3px 0 5px;font-size:25px}.modal-head p{font-size:12px;color:var(--muted);margin:0}.close{font-size:22px;background:transparent;border:0;color:var(--muted);line-height:1.1}.original{background:#f8faf6;border-left:3px solid #bdd0be;padding:14px;margin-bottom:21px;border-radius:4px 10px 10px 4px;white-space:pre-wrap;overflow-wrap:anywhere}.original span{display:block;margin-bottom:6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#6d7a70;font-weight:700}.subhead{font-weight:700;margin:15px 0 9px}.pill-inline{background:#e9f2eb;border-radius:7px;padding:3px 7px;font-size:11px;color:#286448}.footer-hint{font-size:12px;color:var(--muted);margin-top:26px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.compact{max-width:730px}.kpi-line{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:11px 0;font-size:13px}.kpi-line:first-child{border-top:0}.count-note{color:var(--muted);font-size:12px;margin-top:5px}.switches{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:14px 0}.switches:first-of-type{border-top:0}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lock{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:11px}.lock svg{width:14px;height:14px}.text-button{border:0;background:none;padding:0;color:var(--accent);font-size:12px;font-weight:650;text-decoration:underline;text-underline-offset:3px}.muted-line{font-size:12px;color:var(--muted)}
@media(max-width:900px){.app{padding:0 18px}.shell{grid-template-columns:160px minmax(0,1fr)}.main{padding:34px 0 50px 24px}.layout{grid-template-columns:1fr}.side{padding-top:31px}.panel{padding:20px}}
@media(max-width:640px){.app{padding:0 16px}.shell{display:block}.side{border-right:0;border-bottom:1px solid var(--line);height:auto;padding:17px 0 12px;position:static;display:block}.brand{margin:0 0 10px;font-size:22px}.nav{display:flex;gap:4px;overflow:auto}.nav button{font-size:12px;padding:9px 10px;width:auto;white-space:nowrap}.nav svg{width:14px}.side-bottom{display:none}.main{padding:21px 0 50px}.topline{margin-bottom:28px}.topline .meta{font-size:11px}.hero{margin-bottom:22px}.hero-tag{display:none}.stats{gap:7px}.stat{padding:13px 12px;border-radius:12px}.stat .number{font-size:25px}.stat .hint{font-size:11px}.layout{gap:12px}.stack{gap:12px}.panel{padding:18px}.task-row{flex-wrap:wrap}.task-actions{margin-left:30px;width:100%;justify-content:flex-start}.modal{padding:21px}.two-fields{grid-template-columns:1fr}}

.capture-options{display:flex;gap:8px;border:0;margin:0 0 20px;padding:0}.capture-options legend{font-size:12px;font-weight:650;color:#39483d;margin-bottom:7px}.capture-choice{position:relative;cursor:pointer;min-width:103px;text-align:center}.capture-choice input{position:absolute;opacity:0;width:1px;height:1px}.capture-choice span{display:block;border:1px solid var(--line);border-radius:10px;padding:9px 16px;color:#526357;background:#fff;font-weight:610}.capture-choice input:checked+span{background:var(--accent-light);color:var(--accent);border-color:#83b49a}.capture-choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app"><div class="shell">
<aside class="side" aria-label="Main navigation"><div class="brand">noeting<span class="brand-dot">.</span></div><nav class="nav" id="nav"></nav><div class="side-bottom">Notice. Note. Think.<br>Originate from nothing.<br><br>Interactive research prototype<br>Not a production application</div></aside>
<main class="main" id="main"></main></div></div>
<div id="modal-root"></div>
<script>
'use strict';
const STORAGE_KEY='noeting_capture_today_wireframe_v1';
const TYPES=['Note','Task'];
// Old entries keep their original type in storage; only the visible categories are simplified.
const displayType=entry=>entry.type==='Task'?'Task':'Note';
const isNote=entry=>entry.type!=='Task';
const ICONS={capture:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',today:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v5m8-5v5m-8 9h3"/></svg>',library:'<svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 4v16M12 8h4m-4 4h4"/></svg>',review:'<svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/><circle cx="12" cy="12" r="10"/></svg>'};
const initial=()=>({entries:[],tasks:[],chosenThoughtId:null});
let state=initial();let screen='Today', modal=null, filter='All', searchQuery='', storageOK=true, message='';
function load(){try{let saved=localStorage.getItem(STORAGE_KEY);if(saved){let p=JSON.parse(saved);if(Array.isArray(p.entries)&&Array.isArray(p.tasks)) state={...initial(),...p};}}catch(e){storageOK=false;}}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){storageOK=false;}}
function id(){return 'x_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function e(id){return document.getElementById(id)}
function dt(s){if(!s)return null;let d=new Date(s);return isNaN(d)?null:d}
function humanDate(s){let d=dt(s);return d?d.toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'No date'}
function dueDate(s){let d=dt(s);return d?d.toLocaleDateString(undefined,{month:'short',day:'numeric'}):''}
function currentDate(){return new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function beginningToday(){let d=new Date();d.setHours(0,0,0,0);return d}
function endToday(){let d=beginningToday();d.setDate(d.getDate()+1);return d}
function isDue(t){return t.status==='Pending'&&dt(t.dueAt)&&dt(t.dueAt)<endToday()}
function taskFor(entryId){return state.tasks.find(t=>t.entryId===entryId)}
function update(){persist();render()}
function render(){renderNav();renderMain();renderModal()}
function renderNav(){e('nav').innerHTML=[['Today','today'],['Library','library'],['Review','review']].map(([s,icon])=>`<button type="button" data-screen="${s}" class="${screen===s?'active':''}" ${screen===s?'aria-current="page"':''}>${ICONS[icon]}${s}</button>`).join('')}
function header(){return `<div class="topline"><div class="meta">${esc(currentDate())} <span aria-hidden="true">·</span> Local wireframe</div><button class="btn primary" data-action="open-capture">${ICONS.capture}Capture</button></div>`}
function renderMain(){let out=header();if(screen==='Today')out+=today();else if(screen==='Library')out+=library();else out+=review();e('main').innerHTML=out}
function hero(title,desc,tag){return `<section class="hero"><div><div class="eyebrow" style="margin-bottom:12px">${esc(tag)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div></section>`}
function today(){if(window.__noetingDone){return `<div class="done-screen"><div class="mark">✓</div><div class="eyebrow">Session complete</div><h1>Enough for today.</h1><p>Your notes and tasks remain available. No additional content is suggested.</p><button class="btn" data-action="reopen-today">Return to Today</button></div>`}
  const active=state.tasks.filter(t=>t.status==='Pending'),done=state.tasks.filter(t=>t.status==='Completed'),due=active.filter(isDue),prio=active.filter(t=>t.priority),thoughts=state.entries.filter(isNote);
  const ordered=[...active].sort((a,b)=>Number(b.priority)-Number(a.priority)||Number(isDue(b))-Number(isDue(a)));
  let chosen=state.entries.find(t=>t.id===state.chosenThoughtId);
  return hero('Make room for what matters.','Your tasks and a little time to think.','Today')+
  `<div class="daily-summary" aria-label="Daily summary"><strong>Daily summary</strong><span>${active.length} open · ${due.length} due / overdue · ${done.length} completed · ${state.entries.length} saved entries</span></div>`+
  `<div class="layout"><div class="stack"><section class="panel"><div class="panel-head"><div><h2>Tasks</h2><p>Pin up to three tasks to keep them at the top.</p></div><button class="btn tiny" data-action="add-task">+ Add task</button></div><div class="count-note" aria-label="Pinned tasks">${prio.length} / 3 pinned</div>${ordered.length?ordered.map(taskRow).join(''):`<div class="empty">No tasks yet.</div>`}</section></div>`+
  `<div class="stack"><section class="panel"><div class="panel-head"><div><h2>Think, then return</h2><p>One deliberately chosen note. No feed.</p></div><span class="chip">Optional</span></div>${chosen?`<div class="selected-thought"><div class="eyebrow">${displayType(chosen)}</div><div class="quote">“${esc(chosen.text)}”</div><div class="actions"><button class="btn tiny" data-action="reflect" data-id="${chosen.id}" data-mode="Reflection">Reflect</button><button class="btn tiny" data-action="reflect" data-id="${chosen.id}" data-mode="Creation">Create</button><button class="btn tiny ghost" data-action="choose-thought">Change</button></div></div>`:`<div class="empty">${thoughts.length?'Choose a saved note when you want to reflect.':'Add a note to make reflection available.'}</div><div class="actions" style="margin-top:11px"><button class="btn tiny" data-action="choose-thought" ${thoughts.length?'':'disabled'}>Choose a note</button></div>`}</section>`+
  `<section class="finish"><div class="eyebrow">Deliberate stop</div><h2>Enough for today.</h2><p>Leave with no extra recommendations or follow-up prompts.</p><button class="btn" data-action="finish">Finish session →</button></section></div></div>`}
function taskRow(t){const meta=[t.dueAt?`Due ${esc(humanDate(t.dueAt))}`:'',t.remindAt?'Reminder saved (not scheduled)':''].filter(Boolean);return `<div class="task-row${t.priority?' pinned':''}" data-task-id="${t.id}"><button class="checkbox-button" data-action="complete" data-id="${t.id}" aria-label="Mark ${esc(t.title)} complete" title="Mark complete"></button><div class="task-main"><div class="task-title">${esc(t.title)}</div>${meta.length?`<div class="task-sub">${meta.join(' · ')}</div>`:''}</div><div class="task-actions"><button class="icon-btn pin ${t.priority?'active':''}" data-action="priority" data-id="${t.id}" aria-pressed="${Boolean(t.priority)}" aria-label="${t.priority?'Unpin':'Pin'} ${esc(t.title)}" ${!t.priority&&state.tasks.filter(x=>x.priority&&x.status==='Pending').length>=3?'disabled':''}>${t.priority?'Unpin':'Pin'}</button><button class="icon-btn" data-action="edit-task" data-id="${t.id}">Edit</button></div></div>`}
function library(){let entries=[...state.entries].reverse().filter(x=>(filter==='All'||(filter==='Note'?isNote(x):(displayType(x)==='Task'||Boolean(taskFor(x.id)))))&&x.text.toLowerCase().includes(searchQuery.toLowerCase()));return hero('Everything you chose to keep.','Notes and tasks, saved locally.','Library')+`<div class="panel compact"><input class="searchbar" type="search" id="search" placeholder="Search original entries" aria-label="Search original entries" value="${esc(searchQuery)}"><div class="filters">${['All',...TYPES].map(f=>`<button class="filter ${filter===f?'active':''}" data-filter="${esc(f)}">${esc(f)}</button>`).join('')}</div><div class="panel-head"><div><h2>Saved entries</h2><p>${entries.length} shown · ${state.entries.length} stored</p></div></div>${entries.length?entries.map(x=>`<article class="entry-row"><div class="entry-main"><div class="entry-preview note-copy">${esc(x.text)}</div><div class="entry-meta">${displayType(x)} · ${humanDate(x.createdAt)}${x.parentId?' · Linked entry':''}${taskFor(x.id)?' · Linked task':''}</div><div class="detail-actions" style="margin-top:10px">${!taskFor(x.id)&&isNote(x)?`<button class="btn tiny" data-action="clarify" data-id="${x.id}">New task</button>`:taskFor(x.id)?`<span class="pill-inline">Task saved</span>`:''}<button class="btn tiny ghost" data-action="reflect" data-id="${x.id}" data-mode="Reflection">Reflect</button><button class="btn tiny ghost" data-action="reflect" data-id="${x.id}" data-mode="Creation">Create</button>${isNote(x)?`<button class="btn tiny ghost" data-action="select-thought" data-id="${x.id}">Today note</button>`:''}</div></div></article>`).join(''):`<div class="empty">No matching entries.</div>`}</div>`}
function review(){let done=state.tasks.filter(x=>x.status==='Completed'),deferred=state.tasks.filter(x=>x.status==='Deferred'),linked=state.entries.filter(x=>x.parentId);return hero('Review what actually happened.','Completed and deferred tasks, plus linked notes.','Review')+`<div class="stack compact"><section class="panel"><div class="panel-head"><div><h2>Task review</h2><p>Known task states only.</p></div><span class="chip">${done.length} completed · ${deferred.length} deferred</span></div>${done.length||deferred.length?[...done,...deferred].map(t=>`<div class="review-row"><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-sub">${esc(t.status)}</div></div><button class="btn tiny" data-action="edit-task" data-id="${t.id}">Edit</button></div>`).join(''):`<div class="empty">No completed or deferred tasks yet.</div>`}</section><section class="panel"><div class="panel-head"><div><h2>Linked thinking</h2><p>New interpretations never overwrite their sources.</p></div><span class="chip">${linked.length}</span></div>${linked.length?linked.map(x=>`<div class="entry-row"><div class="entry-main"><div class="eyebrow">${esc(x.type)}</div><div class="entry-preview note-copy">${esc(x.text)}</div><div class="entry-meta">Original: ${esc((state.entries.find(p=>p.id===x.parentId)||{}).text||'Not found')}</div></div></div>`).join(''):`<div class="empty">No linked reflections or creations yet. Begin one from Library or Today.</div>`}</section></div>`}
function showModal(html){e('modal-root').innerHTML=`<div class="modal-backdrop" data-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(modal.title||'Dialog')}">${html}</section></div>`;setTimeout(()=>{let target=e(modal.focusId);if(target)target.focus()},0)}
function formHeader(kicker,title,description){return `<div class="modal-head"><div>${kicker?`<div class="eyebrow">${esc(kicker)}</div>`:""}<h2>${esc(title)}</h2><p>${esc(description)}</p></div><button class="close" data-action="close-modal" aria-label="Close dialog">×</button></div>`}
function renderModal(){if(!modal){e('modal-root').innerHTML='';return}if(modal.type==='capture'){showModal(formHeader('','Capture','Save and return to what you were doing.')+`<form id="capture-form"><fieldset class="capture-options"><legend>Type</legend>${TYPES.map(t=>`<label class="capture-choice"><input type="radio" name="type" value="${t}" ${modal.captureType===t?'checked':''}><span>${t}</span></label>`).join('')}</fieldset><div class="field"><label for="capture-text">${modal.captureType==='Task'?'What needs doing?':'What appeared?'}</label><textarea id="capture-text" name="text" required placeholder="${modal.captureType==='Task'?'Write a task…':'Write a note…'}"></textarea></div><div class="form-actions" style="justify-content:flex-end"><button class="btn primary" type="submit">Save & close</button></div></form>`)}
else if(modal.type==='clarify'){let ent=state.entries.find(x=>x.id===modal.id);if(!ent){modal=null;renderModal();return}let suggestion=ent.text.includes('Prepare three slides')?'Prepare three slides':'';showModal(formHeader('Deliberate clarification','Is there a task here?','Suggestions do not create tasks automatically.')+`<div class="original"><span>Original capture · unchanged</span>${esc(ent.text)}</div><form id="clarify-form"><div class="field"><label for="task-candidate">Candidate task title</label><input id="task-candidate" name="title" value="${esc(suggestion)}" placeholder="Type an action you want to accept" required><small>${suggestion?'Example suggestion for scenario S2; rule-based, not AI.':'Enter the action yourself; no AI is running.'}</small></div><div class="notice">Only “Accept task” adds it to Tasks. No due date is inferred.</div><div class="form-actions"><button type="button" class="btn" data-action="dismiss-suggestion" data-id="${ent.id}">Dismiss</button><button class="btn primary" type="submit">Accept task</button></div></form>`)}
else if(modal.type==='task'){let t=state.tasks.find(x=>x.id===modal.id);if(!t){modal=null;renderModal();return}showModal(formHeader('Task','Edit task','Dates and reminders must be entered by you.')+`<form id="task-form"><div class="field"><label for="edit-task-title">Task</label><input id="edit-task-title" name="title" required value="${esc(t.title)}"></div><div class="two-fields"><div class="field"><label for="edit-task-status">Status</label><select id="edit-task-status" name="status">${['Pending','Completed','Deferred'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="edit-task-due">Due date / time</label><input id="edit-task-due" type="datetime-local" name="dueAt" value="${esc(t.dueAt||'')}"></div></div><div class="field"><label for="edit-task-reminder">Reminder time (optional)</label><input id="edit-task-reminder" type="datetime-local" name="remindAt" value="${esc(t.remindAt||'')}"><small>${t.remindAt?'Saved locally. No notification scheduled.':'No reminder recorded.'}</small></div><div class="notice">Prototype limitation: reminder times are saved locally for interaction testing, but device scheduling and notification permissions are not implemented. No notification will fire.</div><div class="form-actions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Save task</button></div></form>`)}
else if(modal.type==='reflect'){let original=state.entries.find(x=>x.id===modal.id);if(!original){modal=null;renderModal();return}showModal(formHeader('Linked thinking',`Add ${modal.mode.toLowerCase()}`,'The original note will not be edited.')+`<div class="original"><span>Original · read only</span>${esc(original.text)}</div><form id="reflect-form"><div class="field"><label for="reflect-text">${modal.mode==='Reflection'?'What changed in your thinking?':'What can you make from this?'}</label><textarea id="reflect-text" name="text" required placeholder="Write a new linked entry…"></textarea></div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Save ${esc(modal.mode.toLowerCase())}</button></div></form>`)}
else if(modal.type==='choose'){let entries=state.entries.filter(isNote);showModal(formHeader('Choose deliberately','One note for Today','Selecting an item will not create a task or new prompt.')+`<div>${entries.length?entries.map(t=>`<div class="entry-row"><div class="entry-main"><div class="entry-preview note-copy">${esc(t.text)}</div><div class="entry-meta">${displayType(t)}</div></div><button class="btn tiny" data-action="select-thought" data-id="${t.id}">Select</button></div>`).join(''):`<div class="empty">No thoughts yet.</div>`}</div><div class="form-actions"><button class="btn" data-action="close-modal">Close</button></div>`)}
}
function open(type,props={}){modal={type,title:type==='capture'?'Capture':type,captureType:'Note',focusId:type==='capture'?'capture-text':type==='clarify'?'task-candidate':type==='task'?'edit-task-title':type==='reflect'?'reflect-text':undefined,...props};renderModal()}
function close(){modal=null;renderModal()}
function action(name,id,el){switch(name){case 'open-capture':open('capture');break;case 'add-task':open('capture',{captureType:'Task'});break;case 'close-modal':close();break;case 'clarify':open('clarify',{id});break;case 'dismiss-suggestion':{let en=state.entries.find(x=>x.id===id);if(en)en.dismissedAt=new Date().toISOString();close();update();break}case 'edit-task':open('task',{id});break;case 'priority':{let t=state.tasks.find(x=>x.id===id);if(!t||t.status!=='Pending')break;if(!t.priority&&state.tasks.filter(x=>x.priority&&x.status==='Pending').length>=3)break;t.priority=!t.priority;update();break}case 'complete':{let t=state.tasks.find(x=>x.id===id);if(t){t.status='Completed';t.priority=false;update()}break}case 'reflect':open('reflect',{id,mode:el.dataset.mode||'Reflection'});break;case 'choose-thought':open('choose');break;case 'select-thought':state.chosenThoughtId=id;window.__noetingDone=false;screen='Today';close();update();break;case 'finish':window.__noetingDone=true;render();break;case 'reopen-today':window.__noetingDone=false;render();break;case 'load-examples':seed();break;case 'reset-data':if(confirm('Remove all local entries and tasks in this prototype?')){state=initial();window.__noetingDone=false;update()}break;}}
document.addEventListener('click',event=>{let el=event.target.closest('[data-action],[data-screen],[data-filter],[data-backdrop]');if(!el)return;if(el.dataset.action){action(el.dataset.action,el.dataset.id,el)}else if(el.dataset.screen){screen=el.dataset.screen;window.__noetingDone=false;render()}else if(el.dataset.filter){filter=el.dataset.filter;renderMain();e('search')?.focus()}else if(el.dataset.backdrop==='true'&&event.target===el)close()});
document.addEventListener('submit',event=>{event.preventDefault();let f=event.target;if(f.id==='capture-form'){let text=f.elements.text.value;if(!text.trim())return;const entry={id:id(),text,type:f.elements.type.value,createdAt:new Date().toISOString(),parentId:null};state.entries.push(entry);if(entry.type==='Task'){state.tasks.push({id:id(),entryId:entry.id,title:text.trim(),status:'Pending',priority:false,dueAt:'',remindAt:''})}close();update()}else if(f.id==='clarify-form'){let title=f.elements.title.value.trim();if(!title)return;state.tasks.push({id:id(),entryId:modal.id,title,status:'Pending',priority:false,dueAt:'',remindAt:''});close();update()}else if(f.id==='task-form'){let t=state.tasks.find(x=>x.id===modal.id);if(!t)return;t.title=f.elements.title.value.trim();t.status=f.elements.status.value;t.dueAt=f.elements.dueAt.value;t.remindAt=f.elements.remindAt.value;if(t.status!=='Pending')t.priority=false;close();update()}else if(f.id==='reflect-form'){let text=f.elements.text.value;if(!text.trim())return;state.entries.push({id:id(),text,type:modal.mode,parentId:modal.id,createdAt:new Date().toISOString()});close();update()}});
document.addEventListener('change',event=>{if(event.target.matches('#capture-form input[name=type]')){let task=event.target.value==='Task';let label=document.querySelector('label[for=capture-text]');if(label)label.textContent=task?'What needs doing?':'What appeared?';let text=e('capture-text');if(text)text.placeholder=task?'Write a task…':'Write a note…'}});
document.addEventListener('input',event=>{if(event.target.id==='search'){searchQuery=event.target.value;let pos=event.target.selectionStart;renderMain();let s=e('search');s.focus();s.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal)close()});
function seed(){if(state.entries.length||state.tasks.length){if(!confirm('Replace current prototype data with fictional S1–S4 test examples?'))return}let now=new Date(),inTwoDays=new Date(now);inTwoDays.setDate(now.getDate()+2);inTwoDays.setHours(9,0,0,0);let withEntry=(text,type)=>{let en={id:id(),text,type,createdAt:now.toISOString(),parentId:null};state.entries.push(en);return en};state=initial();let thought=withEntry('Maybe constant feeds interrupt independent thinking.','Note');let plan=withEntry('Prepare three slides for the team meeting; maybe write a post about the process.','Note');['Boredom may encourage original thought.','Why do I associate productivity with visible output?','A walk without headphones might help me reflect.','Today I noticed I review tasks before ideas.'].forEach((t,i)=>withEntry(t,'Note'));state.tasks=[{id:id(),entryId:plan.id,title:'Prepare three slides',status:'Pending',priority:false,dueAt:'',remindAt:''},{id:id(),entryId:null,title:'Review meeting notes',status:'Pending',priority:false,dueAt:new Date(inTwoDays.getTime()-86400000).toISOString().slice(0,16),remindAt:''},{id:id(),entryId:null,title:'File completed note',status:'Completed',priority:false,dueAt:'',remindAt:''}];state.chosenThoughtId=thought.id;filter='All';searchQuery='';screen='Today';window.__noetingDone=false;close();update()}
// Expose read-only test diagnostics. This does not affect UI or add outside network traffic.
window.noetingPrototype={getSnapshot:()=>JSON.parse(JSON.stringify(state)),loadExamples:seed,reset:()=>{state=initial();screen='Today';modal=null;window.__noetingDone=false;update()}};
load();render();
// Secondary test controls remain explicit and do not appear in the default Capture flow.
const config=document.createElement('details');config.className='demo-tools';config.innerHTML=`<summary>Prototype tools</summary><div class="demo-inner"><div class="muted small">Demo only · No AI, cloud calls, or device reminder delivery${!storageOK?' · Storage unavailable in this browser':''}</div><div class="actions"><button class="btn tiny" data-action="load-examples">Load fictional test examples</button><button class="btn tiny danger" data-action="reset-data">Clear prototype data</button></div></div>`;document.body.appendChild(config);
</script>
</body>
</html>
