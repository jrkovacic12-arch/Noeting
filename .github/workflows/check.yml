name: Noeting quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: noeting-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: TypeScript, SQLite and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Audit output is evidence, not a release or exploitability assessment.
      # Non-blocking until each finding is classified and a policy is accepted.
      - name: Inventory npm dependency advisories
        run: |
          npm audit --json > "$RUNNER_TEMP/noeting-audit.json" || true
          node --input-type=module - "$RUNNER_TEMP/noeting-audit.json" <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const issues = Object.entries(report.vulnerabilities ?? {});
          const rows = issues.map(([name, v]) => ({
            name,
            severity: v.severity,
            direct: v.isDirect ? 'direct' : 'transitive',
            range: v.range,
            fix: v.fixAvailable === false ? 'none reported'
              : typeof v.fixAvailable === 'object'
                ? `${v.fixAvailable.name}@${v.fixAvailable.version}${v.fixAvailable.isSemVerMajor ? ' (major)' : ''}`
                : 'available',
          }));
          const totals = report.metadata?.vulnerabilities;
          const lines = ['### npm dependency advisory inventory', '',
            `Audit: ${totals?.total ?? 'unavailable'} reported; high ${totals?.high ?? '?'}, moderate ${totals?.moderate ?? '?'}.`,
            '', '| Package | Severity | Relationship | Affected range | npm fix |',
            '| --- | --- | --- | --- | --- |',
            ...rows.map(r => `| ${r.name} | ${r.severity} | ${r.direct} | ${r.range} | ${r.fix} |`),
            '', 'Inventory only: determine runtime exposure and Expo compatibility before applying fixes.'];
          if (report.error) lines.push('', `Audit unavailable: ${report.error.summary ?? report.error.code ?? 'unknown error'}`);
          const summary = lines.join('\n') + '\n';
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Build and start real SQLite web harness
        run: |
          mkdir -p work
          npm run web > work/web.log 2>&1 &
          echo $! > work/web.pid
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:8081/ > /dev/null; then exit 0; fi
            if ! kill -0 "$(cat work/web.pid)" 2>/dev/null; then cat work/web.log; exit 1; fi
            sleep 1
          done
          cat work/web.log
          exit 1
      - run: npm run test:ui
      - run: npm run export
      - name: Retain synthetic-test failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: |
            test-results/
            work/web.log
          retention-days: 7
      - name: Stop web harness
        if: always()
        run: if [ -f work/web.pid ]; then kill "$(cat work/web.pid)" 2>/dev/null || true; fi
